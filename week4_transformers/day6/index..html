<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastAPI Demo</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#121212;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:500px;
            background:#1e1e1e;
            padding:30px;
            border-radius:12px;
            box-shadow:0 0 20px rgba(0,0,0,0.4);
        }

        h2{
            text-align:center;
            margin-bottom:20px;
        }

        textarea{
            width:100%;
            height:120px;
            padding:12px;
            border:none;
            border-radius:8px;
            resize:none;
            background:#2b2b2b;
            color:white;
            font-size:16px;
            outline:none;
        }

        button{
            width:100%;
            margin-top:15px;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#3b82f6;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:.2s;
        }

        button:hover{
            background:#2563eb;
        }

        .output{
            margin-top:20px;
            background:#2b2b2b;
            padding:15px;
            border-radius:8px;
            min-height:80px;
            white-space:pre-wrap;
        }

        .label{
            margin-bottom:8px;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Gib sentence</h2>

    <div class="label">Input</div>
    <textarea id="inputText" placeholder="Type your sentence..."></textarea>

    <button onclick="sendData()">Submit</button>

    <div style="margin-top:20px;" class="label">Output</div>
    <div id="output" class="output">Your response will appear here...</div>
</div>

<script>
async function sendData() {

    const sentence = document.getElementById("inputText").value;

    const response = await fetch("http://127.0.0.1:8000/predict", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            text: sentence
        })
    });

    const data = await response.json();

    document.getElementById("output").innerText = data.message;
}
</script>

</body>
</html>
